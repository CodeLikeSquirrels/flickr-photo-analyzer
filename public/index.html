<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flickr Photo Analyzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='10' cy='16' r='7' fill='%230063dc'/><circle cx='22' cy='16' r='7' fill='%23ff0084'/></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="dots"><i></i><i></i></span> Photo Analyzer</div>
    <div class="acct" id="acct"></div>
    <nav id="nav">
      <div class="navgroup">Analyze</div>
      <a href="#/overview" data-page="overview">Overview</a>
      <a href="#/top" data-page="top">Top photos</a>
      <a href="#/recent" data-page="recent">Last 28 days</a>
      <a href="#/timing" data-page="timing">Timing</a>
      <a href="#/tags" data-page="tags">Tags</a>
      <a href="#/map" data-page="map">Map</a>
      <a href="#/albums" data-page="albums">Albums</a>
      <a href="#/cameras" data-page="cameras">Cameras</a>
      <div class="navgroup">Improve</div>
      <a href="#/health" data-page="health">Library health</a>
      <a href="#/explore" data-page="explore">Explore all photos</a>
      <div class="navgroup">App</div>
      <a href="#/settings" data-page="settings">Accounts &amp; settings</a>
    </nav>
    <div class="sidefoot">Data stays on this PC.</div>
  </aside>
  <main>
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
      <div id="jobbar" class="jobbar"></div>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
